# cargo-deny configuration — advisories, licenses, and source hygiene.
#
# Scope: the graph rooted at the CLI, which is exactly what OpenLogi publishes to
# crates.io. The app crates (gui/agent) are not covered: they pull the git-pinned
# gpui/zed tree, which currently trips advisories, licenses, and sources alike.
# The `allow-git` list below is written for that wider graph and is therefore
# unmatched today — kept so widening the scope is a policy decision, not an
# archaeology exercise.
#
# Run locally with the same scope CI uses:
#   cargo deny --all-features --manifest-path crates/openlogi/Cargo.toml check
#   nix run nixpkgs#cargo-deny -- --all-features \
#     --manifest-path crates/openlogi/Cargo.toml check
#   cargo xtask ci cargo-deny

[advisories]
yanked = "deny"
ignore = [
    # bincode 1.3.3 is tarpc's wire codec, reached through tokio-serde 0.9 —
    # it is the IPC protocol's own encoding, and the golden tests in
    # `openlogi-ipc` pin its exact bytes. It entered this graph when
    # `openlogi list` became an agent client; the GUI and agent have always
    # carried it, outside this manifest's scope. The advisory is a maintenance
    # notice rather than a vulnerability: the authors stopped work after a
    # harassment incident and consider 1.3.3 complete, and no upgrade exists
    # (tokio-serde 0.9 is current and binds bincode 1.x). Revisit if tarpc
    # adopts another codec — which would be a breaking protocol change.
    { id = "RUSTSEC-2025-0141", reason = "tarpc's wire codec; unmaintained-by-choice, no upgrade path" },
]

[licenses]
# Additions here need a conscious decision; keep the list to what the graph
# actually pulls in.
allow = [
    "0BSD",
    "CDLA-Permissive-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
# The zed/gpui tree inevitably carries duplicate versions; keep this advisory
# rather than blocking.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The two deliberate direct git deps, plus the git sources they pull in
# transitively (zed's forks and the gpui-updater sibling crate) — everything
# that appears as `git+…` in Cargo.lock must be listed here.
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/longbridge/gpui-component",
    "https://github.com/AprilNEA/gpui-updater",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/reqwest.git",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/wgpu.git",
    "https://github.com/zed-industries/xim-rs.git",
]
