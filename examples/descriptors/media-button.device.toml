write_scope = "vid-pid"

[[parameters.controls]]
id = "media"
labels = { en = "Media button", zh-CN = "媒体键" }
source = { kind = "hid-usage", page = 12, usage = 233 }
trigger = "short-press"
recommended_key = "F18"
