# Synthetic example. Replace the model and verified HID facts for your device.
schema = 1
id = "example.media-button-usb"
revision = "1.0.0"
model = "example.media-button"
name = "Media button"
driver = { id = "org.openlogi.native-hid-remap", parameters = 1 }
platforms = ["macos"]
identity = { strategy = "unverified", default_scope = "model" }

[[matches]]
role = "controls"
transport = "usb-hid"
