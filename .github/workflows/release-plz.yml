name: Release PR

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep rust-cache's environment hash aligned with CI.
  RUSTFLAGS: "-D warnings"

jobs:
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: linux-stable-debug
          save-if: false
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev pkg-config gcc g++ clang libssl-dev libzstd-dev
      # GITHUB_TOKEN pushes do not trigger downstream workflows.
      - name: Mint GitHub App token
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.app-token.outputs.cargo-registry-token }}
      # release-plz skips release=false app crates; git-cliff covers the whole repo.
      - name: Find current release PR
        id: open_release_pr
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const openPulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const releasePulls = openPulls.filter(({ head }) =>
              head.ref.startsWith("release-plz/") &&
              head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );
            let pull;
            for (const candidate of releasePulls) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${context.sha}...${candidate.head.sha}`,
              });
              if (comparison.status === "ahead" || comparison.status === "identical") {
                pull = candidate;
                break;
              }
              core.info(`Ignoring stale release PR #${candidate.number}: ${comparison.status}`);
            }
            if (pull) {
              core.setOutput("branch", pull.head.ref);
              core.setOutput("number", pull.number);
            }
      - name: Build changelog writer
        if: steps.open_release_pr.outputs.branch != ''
        run: cargo build -p xtask
      - name: Check out release PR
        if: steps.open_release_pr.outputs.branch != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.open_release_pr.outputs.branch }}
          fetch-depth: 0
          path: release-pr
          token: ${{ steps.app-token.outputs.token }}
      - name: Install git-cliff
        if: steps.open_release_pr.outputs.branch != ''
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
          fallback: none
      - name: Write root changelog with git-cliff
        if: steps.open_release_pr.outputs.branch != ''
        working-directory: release-pr
        run: ../target/debug/xtask release changelog --config ../cliff.toml
      - name: Commit root changelog
        if: steps.open_release_pr.outputs.branch != ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ steps.open_release_pr.outputs.branch }}
          commit_message: "chore(release): write whole-repo changelog"
          file_pattern: CHANGELOG.md
          repository: release-pr
          commit_user_name: "aprilnea[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "aprilnea[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
      # OpenLogi's whole-repo changelog is the release PR body.
      - name: Replace release PR body with changelog
        if: steps.open_release_pr.outputs.number != ''
        uses: actions/github-script@v8
        env:
          RELEASE_PR_NUMBER: ${{ steps.open_release_pr.outputs.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { readFileSync } = require("node:fs");
            const { owner, repo } = context.repo;
            const pullNumber = Number(process.env.RELEASE_PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            const changelog = readFileSync("release-pr/CHANGELOG.md", "utf8");
            const heading = /^## \[(?!Unreleased\])[^\]]+\][^\n]*$/m.exec(changelog);
            if (!heading) {
              core.setFailed("CHANGELOG.md has no release section.");
              return;
            }
            const start = heading.index;
            const end = changelog.indexOf("\n## [", start);
            const body = changelog.slice(start, end === -1 ? undefined : end).trim();
            if (pull.body === body) {
              core.info("Release PR body changelog already complete.");
              return;
            }
            await github.rest.pulls.update({ owner, repo, pull_number: pullNumber, body });

  # Never publish or tag a master tip newer than the version-bump commit.
  release:
    name: release-plz release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out the version-bump commit
        id: release_commit
        run: cargo xtask release checkout-version-bump
      - uses: Swatinem/rust-cache@v2
        if: steps.release_commit.outputs.skip != 'true'
        with:
          prefix-key: v1-rust
          shared-key: linux-stable-debug
          save-if: false
      - name: Install Linux build deps
        if: steps.release_commit.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev pkg-config gcc g++ clang libssl-dev libzstd-dev
      - name: Verify publish closure
        if: steps.release_commit.outputs.skip != 'true'
        run: cargo xtask release check-publish
      - name: Mint GitHub App token
        if: steps.release_commit.outputs.skip != 'true'
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Run release-plz (release)
        if: steps.release_commit.outputs.skip != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.app-token.outputs.cargo-registry-token }}
