name: Release PR

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep rust-cache's environment hash aligned with CI.
  RUSTFLAGS: "-D warnings"

jobs:
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: linux-stable-debug
          save-if: false
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev pkg-config gcc g++ clang libssl-dev libzstd-dev
      # GITHUB_TOKEN pushes do not trigger downstream workflows.
      - name: Mint GitHub App token
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Run release-plz (release-pr)
        id: release_pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.app-token.outputs.cargo-registry-token }}
      # release-plz skips release=false app crates; git-cliff covers the whole repo.
      - name: Write root changelog with git-cliff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --json headRefName \
              --jq '.[] | select(.headRefName | startswith("release-plz/")) | .headRefName' \
              | head -n1
          )"
          if [[ -z "${branch}" ]]; then
            echo "No open release-plz PR — nothing to write."
            exit 0
          fi
          git config user.name "aprilnea[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Build tools from master; xtask reads the bumped version after checkout.
          cp cliff.toml "${RUNNER_TEMP}/cliff.toml"
          cargo build -p xtask
          cp target/debug/xtask "${RUNNER_TEMP}/xtask"
          git fetch origin "${branch}"
          git checkout --force "origin/${branch}"
          cp "${RUNNER_TEMP}/cliff.toml" cliff.toml
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          export PATH="${RUNNER_TEMP}/git-cliff-2.13.1:${PATH}"
          "${RUNNER_TEMP}/xtask" release changelog
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG already complete."
            exit 0
          fi
          git add CHANGELOG.md cliff.toml 2>/dev/null || git add CHANGELOG.md
          git commit -m "chore(release): write whole-repo changelog"
          git push origin "HEAD:refs/heads/${branch}"
      # OpenLogi's whole-repo changelog is the release PR body.
      - name: Replace release PR body with changelog
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { readFileSync } = require("node:fs");
            const { owner, repo } = context.repo;
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const pull = openPulls.find(({ head }) => head.ref.startsWith("release-plz/"));
            if (!pull) {
              core.info("No open release-plz PR — nothing to update.");
              return;
            }

            const changelog = readFileSync("CHANGELOG.md", "utf8");
            const heading = /^## \[(?!Unreleased\])[^\]]+\][^\n]*$/m.exec(changelog);
            if (!heading) {
              core.setFailed("CHANGELOG.md has no release section.");
              return;
            }
            const start = heading.index;
            const end = changelog.indexOf("\n## [", start);
            const body = changelog.slice(start, end === -1 ? undefined : end).trim();
            if (pull.body === body) {
              core.info("Release PR body changelog already complete.");
              return;
            }
            await github.rest.pulls.update({ owner, repo, pull_number: pull.number, body });
      # release-plz/action may swallow HTTP 422 and report a false no-op.
      - name: Guard against a silently stalled release
        if: steps.release_pr.outputs.prs_created == 'false'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { readFileSync } = require("node:fs");
            const { owner, repo } = context.repo;

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            if (openPulls.some((pull) => pull.head.ref.startsWith("release-plz/"))) {
              core.info("A release PR is already open — nothing to flag.");
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });
            const lastTag = tags
              .map((tag) => tag.name)
              .filter((tag) => /^v\d+\.\d+\.\d+/.test(tag))
              .sort((left, right) => right.localeCompare(left, undefined, { numeric: true, sensitivity: "base" }))[0] ?? "";

            // The tag may lag this parallel job; a newer manifest means the release
            // PR already merged, not that release-pr stalled.
            const manifestVersion = readFileSync("Cargo.toml", "utf8")
              .match(/\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1] ?? "";
            if (lastTag && manifestVersion && `v${manifestVersion}` !== lastTag) {
              core.info(`Workspace version ${manifestVersion} is ahead of ${lastTag} — a release PR already merged; the release job cuts the tag. Nothing to flag.`);
              return;
            }

            const commits = lastTag
              ? (await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${lastTag}...${context.sha}`,
                })).data.commits
              : await github.paginate(github.rest.repos.listCommits, {
                  owner,
                  repo,
                  sha: context.sha,
                  per_page: 100,
                });
            const worthy = commits.filter(({ commit }) => /^(feat|fix|perf)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:/.test(commit.message.split("\n")[0])).length;
            if (worthy !== 0) {
              core.setFailed(`release-plz opened no release PR, but ${worthy} release-worthy commit(s) exist since ${lastTag || "repo start"} and none is open — likely a swallowed release-plz failure (see the release-pr step).`);
              return;
            }
            core.info(`No release PR and no release-worthy commits since ${lastTag || "repo start"}; nothing to release.`);

  # Never publish or tag a master tip newer than the version-bump commit.
  release:
    name: release-plz release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the version-bump commit
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("Cargo.toml").read_text()
          m = re.search(
              r'(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"',
              text,
          )
          if not m:
              sys.exit("workspace.package version not found in Cargo.toml")
          print(m.group(1))
          PY
          )"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists — nothing to release."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          bump_sha="$(git log -1 --format=%H --grep="^chore: release v${version}" || true)"
          if [[ -z "${bump_sha}" ]]; then
            bump_sha="$(
              git log -G '^version = "' --format=%H -- Cargo.toml \
                | while read -r sha; do
                    if git show "${sha}:Cargo.toml" \
                      | python3 -c "import pathlib,re,sys; t=sys.stdin.read(); m=re.search(r'(?ms)^\[workspace\.package\].*?^version\s*=\s*\"([^\"]+)\"', t); sys.exit(0 if m and m.group(1)==sys.argv[1] else 1)" \
                      "${version}"
                    then
                      echo "${sha}"
                      break
                    fi
                  done
            )"
          fi
          if [[ -z "${bump_sha}" ]]; then
            echo "::error::Could not locate the version-bump commit for ${tag}"
            exit 1
          fi
          echo "Checking out version-bump commit ${bump_sha} for ${tag}"
          # release-plz requires an attached branch with an upstream.
          git switch --force -C master "${bump_sha}"
          git branch --set-upstream-to=origin/master master
          echo "skip=false" >> "$GITHUB_ENV"
          echo "release_sha=${bump_sha}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.skip != 'true'
        with:
          prefix-key: v1-rust
          shared-key: linux-stable-debug
          save-if: false
      - name: Install Linux build deps
        if: env.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev pkg-config gcc g++ clang libssl-dev libzstd-dev
      - name: Mint GitHub App token
        if: env.skip != 'true'
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Run release-plz (release)
        if: env.skip != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.app-token.outputs.cargo-registry-token }}
