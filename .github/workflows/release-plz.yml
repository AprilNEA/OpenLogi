name: Release PR

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Match CI so shared-key linux-stable-debug restore hits the env hash.
  RUSTFLAGS: "-D warnings"

jobs:
  # Opens/updates a release PR that bumps the shared workspace version and writes
  # changelogs from the conventional commits since the last release. Merging that
  # PR is what triggers the actual release in the job below.
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: linux-stable-debug
          # CI master is the canonical writer; release-plz only restores.
          save-if: false
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev pkg-config gcc g++ clang libssl-dev libzstd-dev
      # GitHub App token (not a PAT) so the release PR / tag trigger CI and the
      # DMG release workflow — the default GITHUB_TOKEN cannot trigger workflows.
      # App credentials come from the same 1Password item as release.yml.
      - name: Mint GitHub App token
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Run release-plz (release-pr)
        id: release_pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.app-token.outputs.cargo-registry-token }}
      # release-plz only lists commits for packages it processes. App crates with
      # release=false (gui/agent/agent-core) never contribute via changelog_include,
      # so fold every release-worthy subject since the last v* tag into CHANGELOG.md.
      - name: Augment release changelog with app-crate commits
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --json headRefName \
              --jq '.[] | select(.headRefName | startswith("release-plz/")) | .headRefName' \
              | head -n1
          )"
          if [[ -z "${branch}" ]]; then
            echo "No open release-plz PR — nothing to augment."
            exit 0
          fi
          git config user.name "aprilnea[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # The release-plz branch does not yet contain this script on first
          # land; copy it from the master checkout before switching.
          cp scripts/release/augment_changelog.py "${RUNNER_TEMP}/augment_changelog.py"
          git fetch origin "${branch}"
          git checkout --force "origin/${branch}"
          # release-plz wrote CHANGELOG from package-scoped commits; re-scan the
          # full history since the previous tag so gui/agent-only fixes appear.
          python3 "${RUNNER_TEMP}/augment_changelog.py" \
            --changelog CHANGELOG.md \
            --repo-url "https://github.com/${{ github.repository }}"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG already complete."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(release): include all post-tag commits in changelog"
          git push origin "HEAD:refs/heads/${branch}"
      # `release-plz/action` swallows a release-pr HTTP 422 as a warning and
      # reports no PR, which silently stalls releases (it looks identical to a
      # quiet week of commits). Fail loudly when release-plz opened/updated no
      # release PR, none is already open, yet release-worthy commits exist since
      # the last tag — that combination means a swallowed failure, not a no-op.
      # (The blanket 422-swallow is an acknowledged action hack: release-plz/action#264
      # added it to fix that action's own CI; #427 aims to remove it. Once #427
      # lands and we pin an action release that includes it, this guard can go.)
      - name: Guard against a silently stalled release
        if: steps.release_pr.outputs.prs_created == 'false'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { readFileSync } = require("node:fs");
            const { owner, repo } = context.repo;

            // An already-open release PR is the normal "updated, not created" path.
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            if (openPulls.some((pull) => pull.head.ref.startsWith("release-plz/"))) {
              core.info("A release PR is already open — nothing to flag.");
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });
            const lastTag = tags
              .map((tag) => tag.name)
              .filter((tag) => /^v\d+\.\d+\.\d+/.test(tag))
              .sort((left, right) => right.localeCompare(left, undefined, { numeric: true, sensitivity: "base" }))[0] ?? "";

            // The release job runs in parallel and cuts the `v{version}` tag only
            // after publishing, so that tag is usually absent from this job's
            // checkout — never trust the local tag list to decide "did a release
            // just happen". Read the manifest instead: merging a release PR bumps
            // the workspace version, so a manifest version ahead of the last tag
            // means the release already landed (the parallel job is tagging it),
            // not a stall. Only when the manifest still sits at the last released
            // tag can leftover release-worthy commits mean a swallowed release-pr.
            const manifestVersion = readFileSync("Cargo.toml", "utf8")
              .match(/\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1] ?? "";
            if (lastTag && manifestVersion && `v${manifestVersion}` !== lastTag) {
              core.info(`Workspace version ${manifestVersion} is ahead of ${lastTag} — a release PR already merged; the release job cuts the tag. Nothing to flag.`);
              return;
            }

            const commits = lastTag
              ? (await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${lastTag}...${context.sha}`,
                })).data.commits
              : await github.paginate(github.rest.repos.listCommits, {
                  owner,
                  repo,
                  sha: context.sha,
                  per_page: 100,
                });
            const worthy = commits.filter(({ commit }) => /^(feat|fix|perf)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:/.test(commit.message.split("\n")[0])).length;
            if (worthy !== 0) {
              core.setFailed(`release-plz opened no release PR, but ${worthy} release-worthy commit(s) exist since ${lastTag || "repo start"} and none is open — likely a swallowed release-plz failure (see the release-pr step).`);
              return;
            }
            core.info(`No release PR and no release-worthy commits since ${lastTag || "repo start"}; nothing to release.`);

  # Publishes crates + cuts `v{version}` only from the release PR merge commit
  # (`chore: release v*`). release_always=false in release-plz.toml is the primary
  # gate; this job-level filter is defense in depth so a later feature push cannot
  # tag HEAD after a failed-then-retried crates.io publish. On publish failure,
  # re-run this workflow on the release commit SHA — never on a later master tip.
  release:
    name: release-plz release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin to the version-bump commit even if workflow_dispatch is fired from a
      # later master tip (or a re-run that somehow resolves to the wrong SHA).
      - name: Check out the version-bump commit
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("Cargo.toml").read_text()
          m = re.search(
              r'(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"',
              text,
          )
          if not m:
              sys.exit("workspace.package version not found in Cargo.toml")
          print(m.group(1))
          PY
          )"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists — nothing to release."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Prefer the conventional release-PR squash subject; fall back to the
          # first commit that set this workspace version in Cargo.toml.
          bump_sha="$(git log -1 --format=%H --grep="^chore: release v${version}" || true)"
          if [[ -z "${bump_sha}" ]]; then
            bump_sha="$(
              git log -G '^version = "' --format=%H -- Cargo.toml \
                | while read -r sha; do
                    if git show "${sha}:Cargo.toml" \
                      | python3 -c "import pathlib,re,sys; t=sys.stdin.read(); m=re.search(r'(?ms)^\[workspace\.package\].*?^version\s*=\s*\"([^\"]+)\"', t); sys.exit(0 if m and m.group(1)==sys.argv[1] else 1)" \
                      "${version}"
                    then
                      echo "${sha}"
                      break
                    fi
                  done
            )"
          fi
          if [[ -z "${bump_sha}" ]]; then
            echo "::error::Could not locate the version-bump commit for ${tag}"
            exit 1
          fi
          echo "Checking out version-bump commit ${bump_sha} for ${tag}"
          git checkout --force "${bump_sha}"
          echo "skip=false" >> "$GITHUB_ENV"
          echo "release_sha=${bump_sha}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.skip != 'true'
        with:
          prefix-key: v1-rust
          shared-key: linux-stable-debug
          # CI master is the canonical writer; release-plz only restores.
          save-if: false
      - name: Install Linux build deps
        if: env.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev pkg-config gcc g++ clang libssl-dev libzstd-dev
      - name: Mint GitHub App token
        if: env.skip != 'true'
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Run release-plz (release)
        if: env.skip != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.app-token.outputs.cargo-registry-token }}
