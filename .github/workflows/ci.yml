name: CI

# Reproduce every job locally: `cargo xtask ci`
# Job → command map: `.claude/rules/ci.md`
# Changing a `run:` here without updating those two is a bug.

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref (rapid PR pushes / force-pushes).
# Always cancel here: CI never signs or publishes artifacts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # PR caches are isolated to refs/pull/*/merge and still consume the repo's
  # 10 GB allowance. Let PRs reuse master's compiler objects without filling
  # the cache with entries no other PR can read.
  SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
  # Cargo never deletes a stale artifact, so a cached target/ only grows. The
  # cache-volume jobs empty it past this size: the volume is the default
  # 20 GB, and it also holds about 2 GB of registry and git sources plus up to
  # 6 GB that one cold build adds.
  CACHED_TARGET_LIMIT_MB: 10240

# Runners: every job runs on Namespace (namespace.so), which sponsors
# OpenLogi's CI. Labels pick the shape: 2x4 for jobs that compile nothing,
# 8x16 for the Linux and Windows compile jobs (8x32 for Linux clippy and
# MSRV, which need the memory), 6x14 for macOS. Namespace has no Intel Macs,
# so the macOS x86_64 tests run on Apple Silicon under Rosetta 2.
#
# Cache policy:
# - The Linux compile jobs (clippy, MSRV, rustdoc, tests) each attach their own
#   Namespace cache volume, tagged per job because a shared one would be
#   overwritten by whichever job finished last. nscloud-cache-action keeps
#   Cargo's registry, git sources and target/ on it, so unchanged dependencies
#   are fresh and never reach rustc. Only a push to master commits the volume:
#   every other run gets nscloud-cache-exp-do-not-commit, because a fork's PR
#   branch can be called master too.
# - rust-cache keeps Cargo's registry/git inputs only for the other jobs;
#   caching target/ through the GitHub cache produced 0.8-1.4 GB archives
#   whose transfer often cost more than the cache saved. publish closure and
#   wasm still save the linux-stable-debug key that stale-allows.yml restores.
# - sccache stores compiler outputs individually, so jobs fetch only objects
#   they need and can share unchanged dependencies across Cargo commands.
# - only master/main writes CI caches; PR-scoped entries cannot warm other PRs.
jobs:
  fmt:
    name: rustfmt
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      # Reuse this runner to select test jobs without another build or runner.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          # PRs compare against their base; pushes compare the entire pushed range.
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            tests:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'xtask/**'
              - 'tests/**'
              - 'fixtures/devices/**'
              - 'docs/config.example.toml'
              - 'design/icon/openlogi.png'
              - 'design/icon/openlogi.ico'
              - 'packaging/**'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'prek.toml'
              - 'sgconfig.yml'
              - 'release-plz.toml'
              - 'devenv.*'
              - '.envrc'
              - 'flake.*'
              - '!**/*.md'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  typos:
    name: typos
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          config: .config/typos.toml

  # Single-source-of-truth guards stored with their owners: each names the module
  # that owns a decision and fails on its ingredients anywhere else.
  ast-grep:
    name: ast-grep
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@v7
      - uses: ast-grep/action@370e627637505696e4365db4a149af9f2311afe8 # v1.4
        with:
          version: 0.45.1
      # `ast-grep scan` skips hidden directories, so the guards over workflows
      # and release scripts run on `.github` by name.
      - name: Scan .github
        run: ast-grep scan .github

  publish-closure:
    name: publish closure
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          shared-key: linux-stable-debug
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - run: cargo xtask release check-publish

  # The shell equivalent of `rustfmt` + `clippy`. The file set is every tracked
  # file shfmt recognises as a shell script, so a new script is covered the day
  # it lands — including the extensionless `.agents/*` ones, which it detects by
  # shebang. shfmt's formatting options come from `.editorconfig`; passing it a
  # printer flag here would silently discard that file.
  shell:
    name: shell
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: shellcheck,shfmt
      - name: List tracked shell scripts
        run: git ls-files -z | xargs -0 shfmt -f | tee "${RUNNER_TEMP}/shell-scripts"
      - name: shellcheck
        run: xargs shellcheck < "${RUNNER_TEMP}/shell-scripts"
      - name: shfmt
        run: xargs shfmt -d < "${RUNNER_TEMP}/shell-scripts"

  clippy:
    name: clippy
    # Peaked at 86% of 16 GB on 8x16, the most of any Linux job in this file.
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x32-with-cache
      - nscloud-cache-tag-openlogi-clippy
      - ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'nscloud-cache-allow-commit-from-master' || 'nscloud-cache-exp-do-not-commit' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
      - name: Bound the cached target directory
        run: if [ "$(du -sm target | cut -f1)" -gt "$CACHED_TARGET_LIMIT_MB" ]; then find target -mindepth 1 -delete; fi
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The floor tracks current stable (see `rust-version` in the root Cargo.toml),
  # so what this job buys is keeping that number honest: it fails the moment
  # someone reaches for an API newer than what `cargo install` users are
  # promised, which the floating-stable jobs above cannot notice. Both
  # first-class platforms, because macOS and Linux compile disjoint cfg-gated
  # code (evdev/zbus vs the ObjC surface) and a single runner would miss a
  # too-new stabilization on the other side.
  msrv:
    name: MSRV (cargo check, ${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    env:
      # `rust-toolchain.toml` pins the channel to `stable`, and rustup honours
      # that file over whatever toolchain this job installs — so for its whole
      # life this check silently ran stable and never once verified the floor.
      # RUSTUP_TOOLCHAIN outranks the file; keep it in step with the version
      # installed above and with `rust-version`.
      RUSTUP_TOOLCHAIN: "1.99"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: nscloud-macos-tahoe-arm64-6x14
          # 32 GB: on 8x16 a rustc in this check was killed by signal 9.
          - os: linux
            runner:
              - nscloud-ubuntu-24.04-amd64-8x32-with-cache
              - nscloud-cache-tag-openlogi-msrv-linux
              - ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'nscloud-cache-allow-commit-from-master' || 'nscloud-cache-exp-do-not-commit' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - if: runner.os == 'macOS'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          shared-key: msrv-debug
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev pkg-config
      - if: runner.os == 'Linux'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
      - if: runner.os == 'Linux'
        name: Bound the cached target directory
        run: if [ "$(du -sm target | cut -f1)" -gt "$CACHED_TARGET_LIMIT_MB" ]; then find target -mindepth 1 -delete; fi
      - run: cargo check --workspace --all-targets

  # Stable Linux typecheck is covered by `clippy` above (clippy subsumes
  # `cargo check` for the same --workspace --all-targets set — same rationale
  # as clippy-windows). The declared floor stays on the `msrv` matrix.

  docs:
    name: rustdoc (non-GUI crates)
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-tag-openlogi-rustdoc
      - ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'nscloud-cache-allow-commit-from-master' || 'nscloud-cache-exp-do-not-commit' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
      - name: Bound the cached target directory
        run: if [ "$(du -sm target | cut -f1)" -gt "$CACHED_TARGET_LIMIT_MB" ]; then find target -mindepth 1 -delete; fi
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config
      # Everything except the GPUI crates, which would drag the whole graphics
      # toolchain into this job. Excluding by name rather than listing the
      # covered crates keeps a new crate documented by default — the hid-only
      # version of this step let five broken links rot in `openlogi-core`.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps --document-private-items \
            --exclude openlogi-ui \
            --exclude openlogi-desktop \
            --exclude openlogi-overlay \
            --exclude openlogi-agent

  # openlogi-core / openlogi-hid / openlogi-assets / openlogi / openlogi-hook
  # all compile on Linux today (the hook crate has stubs for non-macOS targets).
  # openlogi-desktop needs GPUI's wayland / x11 system libs; the same dependency set
  # the clippy job installs is sufficient. Test workspace there as well so the
  # config-roundtrip and binding suites run on a non-macOS host.
  test-linux:
    needs: fmt
    # A formatting failure must not suppress tests after successful path detection.
    if: ${{ !cancelled() && needs.fmt.outputs.tests == 'true' }}
    name: tests (linux)
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-tag-openlogi-tests-linux
      - ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'nscloud-cache-allow-commit-from-master' || 'nscloud-cache-exp-do-not-commit' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: rust
      - name: Bound the cached target directory
        run: if [ "$(du -sm target | cut -f1)" -gt "$CACHED_TARGET_LIMIT_MB" ]; then find target -mindepth 1 -delete; fi
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev pkg-config
      - run: cargo test --workspace --exclude openlogi-desktop

  test-macos:
    needs: fmt
    # A formatting failure must not suppress tests after successful path detection.
    if: ${{ !cancelled() && needs.fmt.outputs.tests == 'true' }}
    name: tests (macos, ${{ matrix.arch }})
    runs-on: nscloud-macos-tahoe-arm64-6x14
    strategy:
      fail-fast: false
      matrix:
        # Namespace has no Intel Macs. The x86_64 leg cross-compiles on Apple
        # Silicon, as build.yml does for the Intel DMG, and Rosetta 2 runs the
        # x86_64 test binaries. Cargo builds proc-macro tests for the host.
        include:
          - arch: arm64
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          # Both legs run on the same arm64 host, and Cargo's registry/git
          # inputs do not depend on the target triple.
          shared-key: macos-stable-debug
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      # Fails here, not halfway through the suite, when x86_64 code cannot run.
      - name: Ensure Rosetta 2
        if: ${{ matrix.target }}
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
      - if: ${{ !matrix.target }}
        run: cargo test --workspace --all-targets
      - if: ${{ matrix.target }}
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}

  # Runs the workspace's tests on Windows — including the `cfg(windows)` ones,
  # which `clippy (windows)` only compiles and no other host can execute. The
  # same shape as the Linux job: everything but the desktop crate.
  test-windows:
    needs: fmt
    # A formatting failure must not suppress tests after successful path detection.
    if: ${{ !cancelled() && needs.fmt.outputs.tests == 'true' }}
    name: tests (windows)
    runs-on: nscloud-windows-2022-amd64-8x16
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          shared-key: windows-stable-debug
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --exclude openlogi-desktop

  cargo-deny:
    name: cargo-deny
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    env:
      # cargo-deny calls `rustc -vV` through cargo metadata but does not compile.
      # This job deliberately skips the sccache setup used by compilation jobs.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      # Prebuilt binary install is faster than cargo-deny-action's bootstrap path
      # (~100s observed); advisory DB is still fetched by `cargo deny check`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Global flags before subcommand (matches cargo-deny-action defaults).
      # The graph is rooted at the CLI — i.e. exactly the crates published to
      # crates.io. cargo-deny picks its roots from the manifest it is given, so
      # this was implicit while `openlogi` was the workspace root package; with a
      # virtual root it must be explicit, or the git-pinned gpui/zed tree enters
      # the graph and the policy in `.cargo/deny.toml` no longer holds. Widening
      # the scope to the app crates is tracked separately — see that file.
      - run: cargo deny --config .cargo/deny.toml --all-features --manifest-path crates/openlogi/Cargo.toml check

  clippy-windows:
    name: clippy (windows)
    runs-on: nscloud-windows-2022-amd64-8x16
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          shared-key: windows-stable-debug
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      # Whole workspace, matching the Linux jobs — GPUI's DirectX backend
      # covers the GUI on Windows. clippy subsumes `cargo check` and
      # additionally lints the Windows-only code paths (the WH_MOUSE_LL hook,
      # SendInput synthesis, native HID writer, the composite HID++ channel,
      # and the agent's HKCU-Run autostart) that the Linux/macOS clippy jobs
      # never compile.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The same docs the Linux `rustdoc` job builds, built again here because
      # a `cfg`-gated doc target can exist on Linux and macOS yet be missing on
      # Windows — an intra-doc link that then resolves everywhere CI looked.
      # That is neither a compile error nor a clippy lint, so without this step
      # nothing stands between such a break and a Windows contributor finding
      # it by hand, which is how `PermissionStatus::Unknown` (fixed in this PR)
      # reached master.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps --document-private-items \
            --exclude openlogi-ui \
            --exclude openlogi-desktop \
            --exclude openlogi-overlay \
            --exclude openlogi-agent

  # The only job that lints the macOS cfg: the ObjC surface, the CGEventTap
  # hook, CGEvent synthesis, the AVFoundation camera backend, and the
  # launchd/SMAppService registration, none of which the Linux or Windows
  # clippy jobs compile. The pre-push hook runs the same command on a Mac, but
  # a hook can be skipped. Same cache key as `tests (macos)`.
  clippy-macos:
    name: clippy (macos)
    runs-on: nscloud-macos-tahoe-arm64-6x14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          shared-key: macos-stable-debug
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm:
    name: wasm (portable crates)
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-cargo
          # Only Cargo inputs are cached, so the host's stable registry/git
          # cache is reusable even though rustc emits wasm objects via sccache.
          shared-key: linux-stable-debug
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      # A portability gate, not a deliverable: nothing here is built for the
      # browser. `wasm32-unknown-unknown` has no OS under it, so a crate that
      # picks up a filesystem, a randomness source or a thread stops compiling
      # here and nowhere else. The crate list lives in xtask
      # (`WASM_PORTABLE_CRATES`) and the drift test keeps the two in step.
      - run: cargo check -p openlogi-device-registry -p openlogi-hidpp -p openlogi-device --target wasm32-unknown-unknown
      # `openlogi-core` earns its place only with `fs` off: that feature is
      # the config file, and a config file needs a filesystem.
      - run: cargo check -p openlogi-core --no-default-features --target wasm32-unknown-unknown

  # The one status check the master ruleset requires. Requiring this job
  # instead of each job above keeps the ruleset valid across job renames and
  # matrix changes here; a job missing from `needs` is a job that cannot block
  # a merge, which the xtask drift test `ci_results_needs_every_job` catches.
  # `always()` so a failed or skipped dependency still reaches it. A job the
  # `fmt` path filter skipped counts as passed, the same way GitHub treats a
  # skipped required check; a failed or cancelled one fails this job.
  ci-results:
    name: CI results
    if: ${{ always() }}
    needs:
      - fmt
      - typos
      - ast-grep
      - publish-closure
      - shell
      - clippy
      - msrv
      - docs
      - test-linux
      - test-macos
      - test-windows
      - cargo-deny
      - clippy-windows
      - clippy-macos
      - wasm
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    permissions: {}
    steps:
      - name: Summarize
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$RESULTS"
      - name: Fail on a failed or cancelled job
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
