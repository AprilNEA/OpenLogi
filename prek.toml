# Configuration file for `prek`, a fast Git hook manager written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Built-in hooks run natively in Rust — no repo clone, no Python venv, works offline.
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all --"
language = "system"
types = ["rust"]
pass_filenames = false

# Clippy compiles the workspace, so keep it on pre-push rather than every commit.
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets -- -D warnings"
language = "system"
types = ["rust"]
pass_filenames = false
stages = ["pre-push"]

# A broken intra-doc link is neither a compile error nor a clippy lint, so rustdoc
# is the only step that catches one — and deleting or renaming an item silently
# orphans every link to it. Mirrors CI's `rustdoc (non-GUI crates)` job: the GPUI
# crates are excluded because documenting them drags in the graphics toolchain.
# `sh -c` because RUSTDOCFLAGS is an env var and hook entries are not shell strings.
[[repos.hooks]]
id = "cargo-rustdoc"
name = "cargo doc"
entry = "sh -c 'RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps --document-private-items --exclude openlogi-ui --exclude openlogi-desktop --exclude openlogi-overlay --exclude openlogi-agent'"
language = "system"
types = ["rust"]
pass_filenames = false
stages = ["pre-push"]
