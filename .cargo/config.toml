# macOS-only: force rustc to use Apple's real `/usr/bin/cc` as the linker
# driver. Nix's wrapped clang (used in the devenv shell) ignores `SDKROOT`,
# so link-time `-syslibroot` doesn't get set to the real Xcode SDK and core
# libc symbols (`_write`, `_sysconf`, `_waitpid`, ...) referenced from
# `libstd` go unresolved against the Nix stub SDK. Apple's cc honors
# SDKROOT and links libSystem from the right SDK.
#
# Non-devenv contributors on macOS aren't affected by this — `/usr/bin/cc`
# is already what their cargo would pick.
[target.'cfg(target_os = "macos")']
linker = "/usr/bin/cc"

# Dev ergonomics: launch the desktop build from inside a throwaway
# `OpenLogi.app` so macOS shows the real app name + Dock icon during
# development (both are read from a bundle's Info.plist / Resources, which a
# bare `cargo run` binary lacks). The runner is a transparent passthrough for
# the CLI, tests, and every other binary — only `openlogi-desktop` is wrapped.
# A path with a separator is resolved relative to the parent of the directory
# holding this config file — the repo root — so it works from any cwd.
runner = ".cargo/run-macos.sh"

# No static `[env] DEVELOPER_DIR` override here (removed, #1079): Cargo's
# `[env]` table is plain TOML with no way to check whether that path exists,
# so it applied unconditionally to *every* cargo invocation, including the
# non-GUI crates that need no Metal toolchain at all. A contributor with only
# the Command Line Tools installed — or Xcode under a non-standard name such
# as `Xcode-beta.app` — got every build script's linker step pointed at a
# path that doesn't exist, breaking `cargo build`/`check`/`test` entirely,
# not just the GUI's Metal shader compile this was meant to help. `force =
# false` never prevented that: it only yields to a `DEVELOPER_DIR` already
# exported in the shell, which a plain `xcode-select` misconfiguration never
# sets. devenv (`devenv.nix`) and CI (`.github/workflows/*.yml`) already set
# their own correct `DEVELOPER_DIR` independently of this file, so removing
# it doesn't affect either. A contributor building the GUI outside devenv
# with Xcode installed but `xcode-select` pointed at the Command Line Tools
# still has a one-time system fix:
# `sudo xcode-select -s /Applications/Xcode.app/Contents/Developer`.

[alias]
xtask = "run -p xtask --"
