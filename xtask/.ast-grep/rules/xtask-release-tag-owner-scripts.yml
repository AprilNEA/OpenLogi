# Owner: xtask's `support::release_tag` — which channel a release tag belongs
# to, and which earlier tag a release compares with.
id: xtask-release-tag-owner-scripts
language: TypeScript
severity: error
message: Release channels are decided by xtask's support::release_tag; pass the `version` job's outputs (`channel`, `previous_tag`) to this script instead of checking for a pre-release here.
note: |
  The release-notes generator once skipped beta tags with semver.prerelease,
  a second answer to "is this tag stable?" next to ReleaseTag::channel.
  See "Single source of truth" in AGENTS.md.
files:
  - .github/scripts/**/*.ts
ignores:
  - "**/node_modules/**"
rule:
  any:
    - pattern: $SEMVER.prerelease
    - pattern: prerelease($$$ARGS)
