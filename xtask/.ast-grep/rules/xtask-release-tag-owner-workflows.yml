# Owner: xtask's `support::release_tag` — which channel a release tag belongs
# to.
id: xtask-release-tag-owner-workflows
language: yaml
severity: error
message: Release channels are decided by xtask's support::release_tag; read the `version` job's `channel` output instead of matching `-beta` against a tag in a workflow.
note: |
  `cargo xtask release version` parses the tag once and prints its channel.
  A workflow that matched `-beta` in the tag would be a second parser.
  A best-effort syntax guard, without data flow. It fires on a scalar that
  contains `-beta` and either:
  - references a tag or ref: `github.ref_name`, `GITHUB_REF`, `github.ref`,
    `refs/tags`, a shell variable such as `$TAG`, `${RELEASE_TAG}` or
    `$TAG_NAME`, or an expression property such as `env.RELEASE_TAG`; or
  - is in the `tags` / `tags-ignore` filter of an `on.push` trigger, in
    block or flow style, with the key quoted or not.
  Other `-beta` text passes: names, dependency versions, image tags, and an
  action's `with: tags:` input. A tag copied into another variable first
  (`inputs.release_version`) passes too. A `run` script that references a
  ref and also mentions an unrelated `-beta` fires; move the unrelated part
  to its own step.
  See "Single source of truth" in AGENTS.md.
files:
  - .github/workflows/**
rule:
  any:
    - kind: string_scalar
    - kind: single_quote_scalar
    - kind: double_quote_scalar
    - kind: block_scalar
  all:
    - regex: "-beta"
    - any:
        - regex: "(?i)ref_name|github_ref|github\\.ref|refs/tags|\\$\\{?(\\w*_)?tag(_\\w*)?\\b|\\.(\\w*_)?tag(_\\w*)?\\b"
        - inside:
            stopBy: end
            any:
              - kind: block_mapping_pair
              - kind: flow_pair
            has:
              field: key
              regex: "^[\"']?tags(-ignore)?[\"']?$"
            inside:
              stopBy: end
              any:
                - kind: block_mapping_pair
                - kind: flow_pair
              has:
                field: key
                regex: "^[\"']?push[\"']?$"
