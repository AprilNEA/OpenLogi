# release-plz configuration — https://release-plz.dev/docs/config
#
# Unified versioning: every published crate inherits `version.workspace = true`
# from the root Cargo.toml, so the whole workspace moves on a single shared
# version. `version_group` ties the crates together so they are always bumped and
# released in lockstep (the highest next version among them wins), and a single
# `v{version}` tag is cut for the workspace as a whole — which is what
# `.github/workflows/release.yml` listens on to build the macOS DMG.
#
# release-plz cuts the tag only; it does NOT create the GitHub Release. The tag
# triggers release.yml, which is the single owner of the GitHub Release: softprops
# creates it as a draft, uploads the DMGs + checksums, then publishes it last.
# (release-plz publishing the release outright made it immutable before release.yml
# could attach assets — "target_commitish cannot be changed when release is
# immutable". Keep `git_release_enable = false` so release.yml owns the lifecycle.)
#
# Changelog: release-plz is package-path-scoped and skips `release = false` app
# crates (gui/agent), so it does NOT own CHANGELOG.md. Whole-repo notes are
# written by git-cliff via `cliff.toml` after each release-pr (same idea as
# GoReleaser's `changelog.use: git` — every conventional commit since the last
# tag, no per-crate path filter).

[workspace]
# Open release PRs from a `release-plz/`-prefixed branch.
pr_branch_prefix = "release-plz/"
# OpenLogi ships as an application, not a published-API library, so
# cargo-semver-checks' "⚠ API breaking changes" analysis is just noise in the
# release PR. Disable it so the PR shows the changelog, not the break risk.
semver_check = false
# Per-crate tags/releases are off; the root crate owns the one workspace release.
git_tag_enable = false
git_release_enable = false
# Version bumps only — root CHANGELOG.md is written by git-cliff (cliff.toml).
changelog_update = false
# Only publish/tag when the release PR merges (branch prefix above). A later
# master tip after a failed crates.io publish must not cut v{version} — re-run
# the failed release job on that same SHA once credentials are fixed.
release_always = false

[[package]]
name = "openlogi"
version_group = "openlogi"
git_tag_enable = true
git_tag_name = "v{{ version }}"
# GitHub Release is owned by release.yml (softprops), not release-plz — see header.
git_release_enable = false

[[package]]
name = "openlogi-core"
version_group = "openlogi"

# OS input-event synthesis split out of openlogi-core (depends on it). Published
# with the workspace under unified versioning.
[[package]]
name = "openlogi-inject"
version_group = "openlogi"

[[package]]
name = "openlogi-hid"
version_group = "openlogi"

[[package]]
name = "openlogi-assets"
version_group = "openlogi"

# UVC webcam discovery. Published because `openlogi-cli` (published) depends on
# it by an exact version — a crates.io package cannot depend on an unpublished
# path dependency. It must stay in the version group for that same reason: with
# an independently computed next version it can disagree with the group on the
# single shared `version.workspace` field, and a cli published against a
# camera version that was never pushed to crates.io is a hard publish failure.
[[package]]
name = "openlogi-camera"
version_group = "openlogi"

[[package]]
name = "openlogi-cli"
version_group = "openlogi"

[[package]]
name = "openlogi-hook"
version_group = "openlogi"

# Vendored fork of the `hidpp` crate (0BSD, from lus/logy). Published with the
# workspace under unified versioning; upstream's 0.3.0 is provenance only.
[[package]]
name = "openlogi-hidpp"
version_group = "openlogi"

# App crates: not crates.io packages (git gpui deps / login-item binary).
# `publish = false` must mirror each crate's Cargo.toml.
[[package]]
name = "openlogi-desktop"
release = false
publish = false

[[package]]
name = "openlogi-ui"
release = false
publish = false

[[package]]
name = "openlogi-overlay"
release = false
publish = false

[[package]]
name = "openlogi-agent-core"
release = false
publish = false

[[package]]
name = "openlogi-agent"
release = false
publish = false

# Leaf IPC contract crate for the agent<->GUI boundary. Only the two app
# crates above depend on it, so it stays unpublished like they do; if a
# published crate (openlogi-cli, openlogi-hid, …) ever depends on it, it must
# move into the "openlogi" version_group instead — a published crate cannot
# depend on an unpublished path dependency.
[[package]]
name = "openlogi-ipc"
release = false
publish = false
