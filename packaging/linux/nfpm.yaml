# nfpm package descriptor for OpenLogi Linux packages (.deb / .rpm / .pkg.tar.zst).
#
# Build with the xtask:
#   cargo run -p xtask -- linux package
#
# Or directly (requires nfpm in PATH; set VERSION and PKG_ARCH):
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager deb --target target/release
#   VERSION=0.6.0 PKG_ARCH=arm64 nfpm package --packager rpm --target target/release
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager archlinux --target target/release

name: openlogi
version: "${VERSION}"
arch: "${PKG_ARCH}"
maintainer: AprilNEA <dev@aprilnea.me>
description: |-
  Logitech HID++ device control — remap buttons, DPI, and SmartShift.
  An open-source, local-first alternative to Logi Options+. No account,
  no telemetry; configuration lives in a plain TOML file.
homepage: https://github.com/AprilNEA/OpenLogi
license: Apache-2.0 OR MIT

contents:
  # ── binaries ────────────────────────────────────────────────────────────────
  - src: target/release/openlogi
    dst: /usr/bin/openlogi
    file_info:
      mode: 0755

  - src: target/release/openlogi-desktop
    dst: /usr/bin/openlogi-desktop
    file_info:
      mode: 0755

  - src: target/release/openlogi-overlay
    dst: /usr/bin/openlogi-overlay
    file_info:
      mode: 0755

  - src: target/release/openlogi-agent
    dst: /usr/bin/openlogi-agent
    file_info:
      mode: 0755

  # ── udev rules ──────────────────────────────────────────────────────────────
  - src: packaging/linux/udev/70-openlogi.rules
    dst: /etc/udev/rules.d/70-openlogi.rules
    file_info:
      mode: 0644

  # ── systemd user unit ───────────────────────────────────────────────────────
  - src: packaging/linux/systemd/openlogi-agent.service
    dst: /usr/lib/systemd/user/openlogi-agent.service
    file_info:
      mode: 0644

  # ── XDG desktop entry ───────────────────────────────────────────────────────
  - src: packaging/linux/desktop/openlogi.desktop
    dst: /usr/share/applications/openlogi.desktop
    file_info:
      mode: 0644

  # ── GNOME Shell companion extension ─────────────────────────────────────────
  # Per-app profiles need the focused window's WM_CLASS, and Mutter exposes it
  # through no protocol or portal — the extension is the only way to read it on
  # GNOME/Wayland. Shipping it system-wide means a user has to enable it and
  # log back in, rather than first hunting the files down and copying them by
  # hand. Not enabled here: GNOME only loads an extension the user opted into,
  # and Wayland cannot reload the shell without a new session.
  - src: crates/openlogi-hook/gnome-shell-extension/openlogi-frontmost@openlogi.dev/metadata.json
    dst: /usr/share/gnome-shell/extensions/openlogi-frontmost@openlogi.dev/metadata.json
    file_info:
      mode: 0644
  - src: crates/openlogi-hook/gnome-shell-extension/openlogi-frontmost@openlogi.dev/extension.js
    dst: /usr/share/gnome-shell/extensions/openlogi-frontmost@openlogi.dev/extension.js
    file_info:
      mode: 0644

  # ── icon ────────────────────────────────────────────────────────────────────
  # Every standard indexed hicolor size, not just the 1024 master: a stock
  # `hicolor/index.theme` stops at 512x512, so a launcher that resolves icons
  # by theme index (KDE's kbuildsycoca, most GTK launchers) finds nothing at
  # all when only `1024x1024/apps` is installed.
  - src: design/icon/openlogi.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/openlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/openlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/openlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/openlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/openlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/openlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/openlogi.png
    file_info:
      mode: 0644
  - src: design/icon/openlogi-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/openlogi.png
    file_info:
      mode: 0644

  - src: LICENSE-APACHE
    dst: /usr/share/licenses/openlogi/LICENSE-APACHE
    file_info:
      mode: 0644

  - src: LICENSE-MIT
    dst: /usr/share/licenses/openlogi/LICENSE-MIT
    file_info:
      mode: 0644

archlinux:
  packager: "AprilNEA <dev@aprilnea.me>"

overrides:
  archlinux:
    depends:
      - dbus
      - fontconfig
      - gcc-libs
      - glibc
      - libglvnd
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-icd-loader
      - wayland

scripts:
  postinstall: packaging/linux/nfpm-scripts/postinstall.sh
  postremove: packaging/linux/nfpm-scripts/postremove.sh
