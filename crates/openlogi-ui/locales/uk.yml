"OpenLogi captures mouse buttons (Back / Forward / gesture button) through the system Accessibility permission and runs the actions you bind. Features that talk to the device directly — DPI, SmartShift — are unaffected.": "OpenLogi перехоплює кнопки миші (Назад / Вперед / кнопку жестів) через системний дозвіл «Доступність» і виконує прив'язані вами дії. Функції, що працюють із пристроєм напряму — DPI, SmartShift — від цього не залежать."
"Enable “OpenLogi Agent” in the Accessibility list — the background agent owns the mouse hook, not the OpenLogi app. If it already shows as enabled, remove the stale entry with the − button and add it back.": "Увімкніть «OpenLogi Agent» у списку «Доступність» — перехопленням миші керує фоновий агент, а не програма OpenLogi. Якщо він уже позначений як увімкнений, вилучіть застарілий запис кнопкою − і додайте його знову."
