[permissions]
accessibility_permission_required = "\u202Bנדרשת הרשאת נגישות\u202C"
accessibility_permission_description = "\u202BOpenLogi משתמשת בהרשאת הנגישות כדי לקלוט לחיצות על לחצני העכבר, כולל \"אחורה\", \"קדימה\" ולחצן המחוות, ולהפעיל את הפעולות שהוקצו להם. ה-DPI ו-SmartShift לא מושפעים.\u202C"
accessibility_agent_instructions = "\u202Bיש להפעיל את \"OpenLogi Agent\" ברשימת הנגישות, כי הסוכן ברקע מטפל בקלט העכבר. אם הוא כבר מופעל, יש להסיר את הרשומה הקיימת ולהוסיף אותה שוב.\u202C"
open_system_settings_to_grant_access = "\u202Bפתיחת הגדרות המערכת כדי להעניק גישה\u202C"
permission_applies_without_restart = "\u202Bנכנס לתוקף אוטומטית, בלי צורך בהפעלה מחדש.\u202C"
not_now_use_dpi_and_other_features_only = "\u202Bלא עכשיו (שימוש ב-DPI ובתכונות אחרות בלבד)\u202C"
accessibility_granted = "\u202Bהרשאת הנגישות הוענקה\u202C"
accessibility_not_granted_click_to_grant = "\u202Bהרשאת הנגישות לא הוענקה · יש ללחוץ כדי להעניק\u202C"
