accessibility = "\u202Bנגישות\u202C"
input_monitoring = "\u202Bניטור קלט\u202C"
bluetooth = "Bluetooth"
input_device_access = "\u202Bגישה להתקני קלט\u202C"
granted = "\u202Bהוענקה\u202C"
not_granted = "\u202Bלא הוענקה\u202C"
unknown = "\u202Bלא ידוע\u202C"
not_requested = "\u202Bלא התבקשה\u202C"
grant = "\u202Bהענקה\u202C"
accessibility_permission_requirement = "\u202Bנדרשת למחוות ולמיפוי מחדש של לחצנים.\u202C"
input_monitoring_permission_description = "\u202Bנדרשת לקריאת נתוני HID++\u200E, כולל עכברים המחוברים ישירות ב-Bluetooth.\u202C"
input_monitoring_granted_but_unavailable = "\u202Bההרשאה הוענקה, אבל OpenLogi עדיין לא יכולה לפתוח מכשירים. ייתכן שאפליקציה אחרת תופסת אותם: יש לצאת מ-Logi Options+\u200E או לכבות את Modify events ב-Karabiner-Elements. אחרת, יש להתנתק מ-macOS ולהתחבר שוב.\u202C"
input_monitoring_agent_instructions = "\u202Bיש להפעיל את \"OpenLogi Agent\" ברשימת ניטור הקלט, כי הסוכן ברקע קורא את המכשירים. אם הוא כבר מופעל, יש להסיר את הרשומה ולהוסיף אותה שוב, או להתנתק מ-macOS ולהתחבר שוב.\u202C"
drag_app_into_list = "\u202Bיש לגרור את %{app} לרשימה שלמעלה\u202C"
bluetooth_permission_description = "\u202Bמאפשרת ל-OpenLogi להשתמש ב-CoreBluetooth. לא נדרשת לגישת HID.\u202C"
camera_permission_description = "\u202Bיש להעניק גישה כדי להציג תצוגה מקדימה של מצלמת הרשת של Logitech בעמוד הראשי. הווידאו אף פעם לא יוצא מה-Mac.\u202C"
linux_input_access_denied_description = "\u202BOpenLogi זקוקה לגישת קריאה וכתיבה ל-\u200E/dev/uinput למיפוי מחדש של לחצנים, לגישת קריאה וכתיבה ל-\u200E/dev/hidraw*\u200E לתקשורת HID++\u200E, ולגישת קריאה לצומת \u200E/dev/input/event*\u200E של העכבר עבור קליטת הלחצנים. כללים שהשאיר מנהל Logitech אחר מכסים לעיתים קרובות את שני הראשונים אבל לא את השלישי. כדי להעניק גישה, יש להתקין את כללי ה-udev של OpenLogi.\u202C"
linux_input_access_unknown_description = "\u202Bלא זוהה מכשיר Logitech. יש לחבר מכשיר או לוודא שכללי ה-udev של hidraw מותקנים.\u202C"
linux_input_access_guide = "\u202Bהצגת המדריך\u202C"
linux_grant_access = "\u202Bהענקת גישה…\u202C"
linux_grant_waiting = "\u202Bממתין לאישור מנהל המערכת…\u202C"
linux_grant_cancelled = "\u202Bהאישור בוטל. לא בוצע שום שינוי.\u202C"
linux_grant_pkexec_missing = "\u202Bpkexec לא מותקן, ולכן OpenLogi לא יכולה לבקש גישת מנהל מערכת. יש להתקין את polkit או לפעול לפי המדריך.\u202C"
linux_grant_failed = "\u202Bלא ניתן היה להתקין את כללי ה-udev: \u200F%{reason}\u202C"
linux_grant_still_missing = "\u202Bכללי ה-udev מותקנים, אבל הגישה עדיין חסרה. יש לחבר מחדש את מכשיר ה-Logitech, או להתנתק ולהתחבר שוב. אם זה לא עוזר, יש לפעול לפי המדריך.\u202C"
linux_input_access_flatpak = "\u202Bה-Flatpak הזה לא יכול להתקין כללי udev במערכת המארחת. יש להריץ את הפקודה הזו במסוף, ואז לחבר מחדש את מכשיר ה-Logitech:\u202C"
linux_input_access_nixos = "\u202Bב-NixOS, כללי udev מגיעים מתצורת המערכת. יש להגדיר programs.openlogi.enable = true ולבנות מחדש.\u202C"

