"Accessibility permission required": "Патрабуецца дазвол «Даступнасць»"
"OpenLogi captures mouse buttons (Back / Forward / gesture button) through the system Accessibility permission and runs the actions you bind. Features that talk to the device directly — DPI, SmartShift — are unaffected.": "OpenLogi перахоплівае кнопкі мышы («Назад» / «Наперад» / кнопку жэстаў) праз сістэмны дазвол «Даступнасць» і выконвае прывязаныя вамі дзеянні. Функцыі, якія злучаюцца з прыладай непасрэдна — DPI, SmartShift — ад гэтага не залежаць."
"Enable “OpenLogi Agent” in the Accessibility list — the background agent owns the mouse hook, not the OpenLogi app. If it already shows as enabled, remove the stale entry with the − button and add it back.": "Уключыце «OpenLogi Agent» у спісе «Даступнасць» — перахопам мышы кіруе фонавы агент, а не праграма OpenLogi. Калі ён ужо паказаны як уключаны, выдаліце састарэлы запіс кнопкай − і дадайце яго зноў."
