[package]
name = "openlogi-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenLogi background agent — headless, always-on owner of the input hook, HID++ device I/O, and (later) the menu-bar tray."
# Distributed as a login-item helper inside the bundled .app; never published.
publish = false

[[bin]]
name = "openlogi-agent"
path = "src/main.rs"

# Hardware-free mock agent for GUI development: serves a scripted inventory over
# the real IPC socket. Dev-only — xtask bundles `openlogi-agent` by exact path,
# so this binary never ships.
[[bin]]
name = "openlogi-agent-mock"
path = "src/bin/mock_agent.rs"

[dependencies]
openlogi-agent-core = { path = "../openlogi-agent-core" }
openlogi-core = { path = "../openlogi-core" }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
tarpc = { workspace = true }
interprocess = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal"] }
futures = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
opener = { workspace = true }
succession = { version = "0.2", features = ["supervision", "eviction"] }
tracing-appender = "0.2.5"

# Held at the version Cargo.lock already has for gpui's own build-dependency;
# bumping it independently would move the pinned gpui rev.
parking_lot = { workspace = true }

[build-dependencies]
embed-resource = "3.0.9"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSApplication", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSString", "NSData", "NSArray", "NSNotification"] }
plist = "1.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
