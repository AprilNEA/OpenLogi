[package]
name = "openlogi-device-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure hardware identity registry for OpenLogi devices and receivers."
keywords = ["logitech", "hidpp", "device", "registry", "hid"]
categories = ["hardware-support", "no-std"]

[features]
# Serialize and deserialize the G600 DPI types, so they can cross the agent's
# IPC unchanged. Validated types re-validate on deserialize.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[lints]
workspace = true
