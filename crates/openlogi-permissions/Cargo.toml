[package]
name = "openlogi-permissions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Privacy-permission status and remediation deep links for OpenLogi (macOS TCC, Linux device-file access)."
# Not publishable to crates.io: depends on the unpublished openlogi-camera path.
publish = false

# Reading status never prompts, so this crate stays free of any UI toolkit —
# whoever owns the resource raises its prompt (see the crate docs).
[target.'cfg(target_os = "macos")'.dependencies]
openlogi-camera = { path = "../openlogi-camera" }
objc2 = { workspace = true }
objc2-io-kit = { workspace = true, features = ["std", "hidsystem"] }
opener = { workspace = true }
tracing = { workspace = true }

# `openlogi-core` only for the Logitech vendor ID — it is pure types, no I/O.
[target.'cfg(target_os = "linux")'.dependencies]
openlogi-core = { version = "0.9.0", path = "../openlogi-core" }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
