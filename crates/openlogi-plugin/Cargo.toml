[package]
name = "openlogi-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Device descriptors and sandboxed peripheral components for OpenLogi"
publish = false

[dependencies]
cap-std = { version = "4.0.3", optional = true }
openlogi-core = { version = "0.8.11", path = "../openlogi-core", default-features = false }
openlogi-device-registry = { version = "0.8.11", path = "../openlogi-device-registry" }
semver = "1.0.28"
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
tempfile = { version = "3.27.0", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"], optional = true }
toml.workspace = true
wasmparser = "0.260.0"
wasmtime = { version = "49.0.1", default-features = false, features = ["std", "runtime", "component-model", "cranelift", "pulley"], optional = true }

[lints]
workspace = true

[features]
runner = ["dep:wasmtime", "dep:tokio"]
packages = ["dep:cap-std", "dep:tempfile"]

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.260.0"
wit-component = "0.260.0"

[[example]]
name = "runtime-probe"
required-features = ["runner"]
