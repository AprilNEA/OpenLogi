[package]
name = "openlogi-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless orchestration shared by the OpenLogi background agent: hook runtime, HID++ writes, DPI cycle, Actions Ring session state."
# Links path-only siblings and is bundled inside the .app via openlogi-agent.
publish = false

[dependencies]
axwatch = { workspace = true }
openlogi-core = { path = "../openlogi-core", features = ["worker"] }
openlogi-inject = { path = "../openlogi-inject" }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
futures-lite = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
openlogi-plugin = { version = "0.8.11", path = "../openlogi-plugin", features = ["packages", "runner"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
atomic-write-file.workspace = true
openlogi-device-registry = { version = "0.8.11", path = "../openlogi-device-registry" }
openlogi-camera = { version = "0.8.11", path = "../openlogi-camera" }

[lints]
workspace = true

[dev-dependencies]
# Only to advance virtual time in the DeviceOp/timed timeout test without a
# real multi-second sleep.
openlogi-fixture = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
