[package]
name = "openlogi-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless orchestration shared by the OpenLogi background agent: hook runtime, HID++ writes, DPI cycle, Actions Ring session state."
# Links path-only siblings and is bundled inside the .app via openlogi-agent.
publish = false

[dependencies]
axwatch = { workspace = true }
openlogi-core = { path = "../openlogi-core", features = ["worker"] }
openlogi-flow = { path = "../openlogi-flow" }
openlogi-inject = { path = "../openlogi-inject" }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
# The embedded action icons and the Lucide catalog — not the GPUI asset source.
openlogi-ui = { path = "../openlogi-ui", default-features = false, features = ["lucide"] }
futures-lite = { workspace = true }
# The keypad LCD watcher's doubling retry delay.
backon = { workspace = true }
# Keypad LCD tiles: rasterize an action icon's SVG, a key face's label, symbol
# and picture, and encode it as the JPEG the keypad's image write carries.
# resvg matches the version gpui links; its text features lay out labels and
# emoji with the system fonts.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "raster-images"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Live keypad keys: the clock source, and a command's JSON value.
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
serde_json = { workspace = true }
# The machine name Flow peers show for this computer.
gethostname = "1.1.0"

[lints]
workspace = true

[dev-dependencies]
openlogi-device = { path = "../openlogi-device", features = ["test-support"] }
# Only to advance virtual time in the DeviceOp/timed timeout test without a
# real multi-second sleep.
openlogi-fixture = { workspace = true, features = ["fs"] }
# Keypad identities the orchestrator tests stand a wired keypad up from.
openlogi-device-registry = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
