[package]
name = "openlogi-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless orchestration shared by the OpenLogi background agent: hook runtime, HID++ writes, DPI cycle, Actions Ring session state."
# Links path-only siblings and is bundled inside the .app via openlogi-agent.
publish = false

[dependencies]
axwatch = { workspace = true }
openlogi-core = { path = "../openlogi-core", features = ["worker"] }
openlogi-flow = { path = "../openlogi-flow" }
openlogi-inject = { path = "../openlogi-inject" }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
# The embedded action icons only — not the GPUI asset source.
openlogi-ui = { path = "../openlogi-ui", default-features = false }
futures-lite = { workspace = true }
# The keypad LCD watcher's doubling retry delay.
backon = { workspace = true }
# Keypad LCD tiles: rasterize an action icon's SVG, or decode a PNG or JPEG
# supplied at runtime, and encode it as the JPEG the keypad's image write
# carries. resvg matches the version gpui links.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = { version = "0.46", default-features = false }
thiserror = { workspace = true }
# Key modules run as child processes, spoken to in newline-delimited JSON
# over their stdin and stdout; their images arrive base64-encoded and their
# settings come from `config.toml`.
tokio = { workspace = true, features = ["process", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
toml = { workspace = true }
tracing = { workspace = true }
# The machine name Flow peers show for this computer.
gethostname = "1.1.0"

[target.'cfg(unix)'.dependencies]
# killpg: a module is killed with its whole process group.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `CREATE_NO_WINDOW`, so a console module opens no window.
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
openlogi-device = { path = "../openlogi-device", features = ["test-support"] }
# Only to advance virtual time in the DeviceOp/timed timeout test without a
# real multi-second sleep.
openlogi-fixture = { workspace = true, features = ["fs"] }
# Keypad identities the orchestrator tests stand a wired keypad up from.
openlogi-device-registry = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
