# Owner: dispatch::wheel::zoom owns slider normalization
# for both platform consumers. Per-report acceleration lives in binding::motion.
id: agent-wheel-zoom-response-owner
language: rust
severity: error
message: Use dispatch::wheel::zoom for Zoom speed; do not duplicate its sensitivity normalization.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-agent-core/src/watchers/gesture/dispatch/wheel/zoom.rs
rule:
  all:
    - kind: function_item
    - has:
        pattern: ThumbwheelSensitivity::DEFAULT.into_inner()
        stopBy: end
    - has:
        pattern: ThumbwheelSensitivity::MIN.into_inner()
        stopBy: end
    - has:
        pattern: ThumbwheelSensitivity::MAX.into_inner()
        stopBy: end
