# Owner: hardware::SavedLightingWrites fences and serializes saved RGB writes.
id: saved-lighting-owner
language: rust
severity: error
message: Saved RGB automation must call set_saved_lighting, which rejects superseded config revisions before hardware I/O.
files:
  - crates/openlogi-cli/src/cmd/api/**/*.rs
ignores:
  - "**/tests.rs"
  - "**/tests/**"
rule:
  pattern: $CLIENT.set_lighting($CONTEXT, $ROUTE, $LIGHTING)
