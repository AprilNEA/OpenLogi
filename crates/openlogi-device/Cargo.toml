[package]
name = "openlogi-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The contract between OpenLogi's HID++ layer and the HID stack beneath it."
keywords = ["logitech", "hidpp", "hid", "backend"]
categories = ["hardware-support"]

# Nothing here may reach a host. That is not a style preference — it is what
# lets a second backend (a scripted device tree, WebHID under wasm) exist at
# all, and CI's `wasm (portable crates)` job holds this manifest to it. Adding
# a dependency that cannot build for `wasm32-unknown-unknown` breaks that job.
[dependencies]
hidpp = { workspace = true }
openlogi-core = { version = "0.8.3", path = "../openlogi-core", default-features = false }
openlogi-device-registry = { workspace = true }
futures-lite = { workspace = true }
futures-concurrency = "7"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-channel = "2.3.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
