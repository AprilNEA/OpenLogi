[package]
name = "openlogi-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The contract between OpenLogi's HID++ layer and the HID stack beneath it."
keywords = ["logitech", "hidpp", "hid", "backend"]
categories = ["hardware-support"]

# Nothing here may reach a host. That is not a style preference — it is what
# lets a second backend (a scripted device tree, WebHID under wasm) exist at
# all, and CI's `wasm (portable crates)` job holds this manifest to it. Adding
# a dependency that cannot build for `wasm32-unknown-unknown` breaks that job.
[dependencies]
hidpp = { workspace = true }
openlogi-core = { version = "0.8.1", path = "../openlogi-core", default-features = false }
openlogi-device-registry = { workspace = true }
futures-lite = { workspace = true }
futures-concurrency = "7"
# The one timer for both targets — see `src/time.rs`. Already in the graph via
# `openlogi-hidpp`, the other crate on the portable list.
futures-timer = "3.0.4"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# `futures-timer` only reaches for the browser's timer under this feature;
# without it a wasm build silently gets the thread-backed native path, which is
# the runtime panic this crate is trying not to have. Scoped to the wasm target
# so native builds pull neither `gloo-timers` nor `send_wrapper`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
