[package]
name = "openlogi-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Logitech USB microphone discovery and feature-unit controls through the host audio stack (CoreAudio on macOS)."
keywords = ["logitech", "microphone", "usb-audio", "coreaudio", "yeti"]
categories = ["hardware-support", "multimedia::audio"]

[dependencies]
openlogi-core = { version = "0.8.19", path = "../openlogi-core", default-features = false }
openlogi-device-registry = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { workspace = true, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFString"] }

[lints]
workspace = true
