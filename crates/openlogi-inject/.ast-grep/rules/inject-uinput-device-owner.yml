# Owner: openlogi_inject::uinput — the names of OpenLogi's uinput devices and
# the check that recognizes them.
id: inject-uinput-device-owner
language: rust
severity: error
message: Create uinput devices with openlogi_inject::uinput::builder and recognize them with uinput::is_own_device, the uinput device-name owner.
note: |
  The Linux hook refused devices by a name prefix that openlogi-inject
  repeated by hand when it named its action injector, so a rename had to
  change both copies in lockstep. The names also carried "OpenLogi", whose
  "pen" made GNOME Shell's X11 backend treat both devices as a stylus and
  swap the middle and right buttons (#1842). Name and recognize uinput
  devices only through the owner. See "Single source of truth" in AGENTS.md.

  A copied check that goes through its own constant is caught where that
  constant is defined: a const or static whose value is a device-name
  prefix or a device name.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-inject/src/uinput.rs
rule:
  any:
    - pattern: VirtualDevice::builder()
    - pattern: $PATH::VirtualDevice::builder()
    - pattern: VirtualDeviceBuilder::new()
    - pattern: $PATH::VirtualDeviceBuilder::new()
    # A prefix check written with a literal.
    - pattern: $NAME.starts_with($PREFIX)
    # A copied prefix or name held in a constant, whatever the constant is
    # called.
    - pattern: 'const $CONST: $TYPE = $VALUE;'
    - pattern: 'static $CONST: $TYPE = $VALUE;'
    # A device name written out, for example in an equality check.
    - all:
        - kind: string_literal
        - regex: '^"(OL|OpenLogi) (virtual mouse|action injector)"$'
constraints:
  PREFIX:
    regex: '^"(OL|OpenLogi) "$'
  VALUE:
    regex: '^"(OL|OpenLogi) (virtual mouse|action injector)?"$'
