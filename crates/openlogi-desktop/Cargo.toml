[package]
name = "openlogi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPUI-based desktop UI for OpenLogi."
default-run = "openlogi-desktop"
# Not publishable to crates.io: depends on git-only gpui / gpui_platform
# (gpui_platform is not on the registry). Distributed as a bundled .app.
publish = false

[[bin]]
name = "openlogi-desktop"
path = "src/main.rs"

[dependencies]
appcatalog = "0.1.1"
openlogi-core = { path = "../openlogi-core" }
openlogi-ui = { path = "../openlogi-ui" }
openlogi-camera = { path = "../openlogi-camera" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-assets = { path = "../openlogi-assets" }
openlogi-ipc = { path = "../openlogi-ipc" }
openlogi-permissions = { path = "../openlogi-permissions" }
tarpc = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-base = { workspace = true }
gpui-component-assets = { workspace = true }
swr-core = { workspace = true }
swr-gpui = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
rust-i18n = "4"
# The raw, un-negotiated system locale for the diagnostics report; locale
# *negotiation* lives in openlogi-ui.
sys-locale = "0.3.2"
gpui-updater = { git = "https://github.com/AprilNEA/gpui-updater", tag = "v0.0.7", features = ["gpui"] }
# Spawns the agent under its own macOS TCC identity (see ipc_client::spawn_agent).
disclaim = "0.1"
url = "2.5.8"
walkdir = "2.5.0"
backon.workspace = true
opener = { workspace = true }
derive_more = { version = "2.1.1", default-features = false, features = ["display", "from"] }
# The user-picked app icon (Settings -> Appearance). Cross-platform: every
# call is inert off macOS, which is the only OS that can change an installed
# app's icon after the fact.
appicon = { git = "https://github.com/AprilNEA/appicon", tag = "v0.1.1" }

# Held at the version Cargo.lock already has for gpui's own build-dependency;
# bumping it independently would move the pinned gpui rev.
[build-dependencies]
embed-resource = "3.0.9"

# Window chrome, host OS string, and installed-app icon lookup only — the
# menu-bar status item lives in the agent, not here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSAppearance"] }
objc2-foundation = { workspace = true, features = ["NSProcessInfo", "NSString", "NSError"] }
objc2-service-management = { workspace = true, features = ["std", "SMAppService", "SMErrors", "objc2", "objc2-foundation"] }

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
openlogi-device = { path = "../openlogi-device" }
tempfile = "3.27.0"

[package.metadata.bundle]
name = "OpenLogi"
identifier = "org.openlogi.openlogi"
# No `version` override — cargo-bundle falls back to the crate version, which
# is workspace-unified. A literal here goes stale the moment release-plz bumps.
category = "public.app-category.utilities"
short_description = "Lightweight local-first companion for Logitech HID++ peripherals."
long_description = """\
OpenLogi talks to Logitech HID++ mice and keyboards directly — no \
cloud account, no telemetry, no auto-update poller. Plain TOML config, \
single binary; device renders are fetched on demand on first launch.
"""
osx_minimum_system_version = "13.0"
# Deep-link scheme for the release app. The dev build is hand-bundled, so its
# dev/Info.plist declares the same scheme separately — keep the two in sync.
osx_url_schemes = ["openlogi"]
icon = ["icon/AppIcon.icns"]
resources = ["assets/**/*"]
