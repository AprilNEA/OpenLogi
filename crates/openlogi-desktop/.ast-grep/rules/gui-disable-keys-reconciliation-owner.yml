# Owner: AppState::reconcile_external_config. Every external-file adoption
# invalidates Disable Keys snapshots, closes the shared fence, and activates locale.
id: gui-disable-keys-reconciliation-owner
language: rust
severity: error
message: Use AppState::reconcile_external_config to adopt an external file; it owns snapshot invalidation, the revision fence, projections, and locale activation.
files:
  - crates/openlogi-desktop/src/**/*.rs
rule:
  all:
    - pattern: $CONFIG.refresh_feature()
    - not:
        inside:
          kind: function_item
          stopBy: end
          has:
            field: name
            regex: '^reconcile_external_config$'
