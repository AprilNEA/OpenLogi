# Owner: openlogi_core::env — the environment variables more than one process
# reads — and openlogi_core::logging, which turns the log variable and its
# fallback into the filter every process installs.
id: core-env-knob-owner
language: rust
severity: error
message: The environment knobs read in more than one place are openlogi_core::env's (PROFILE, LOG, ASSETS, FORCE_DEPOT), and the log filter is openlogi_core::logging's (env_filter, init_stderr); use them instead of a literal or a hand-built filter here.
note: |
  Five binaries spelled the log filter variable and its default by hand. See
  "Single source of truth" in AGENTS.md.
files:
  - crates/**/*.rs
  - xtask/**/*.rs
ignores:
  - crates/openlogi-core/**
rule:
  any:
    - pattern: '"OPENLOGI_PROFILE"'
    - pattern: '"OPENLOGI_LOG"'
    - pattern: '"OPENLOGI_ASSETS"'
    - pattern: '"OPENLOGI_FORCE_DEPOT"'
    # A fallback filter spelled inline instead of env::LOG_DEFAULT.
    - pattern: EnvFilter::new($FILTER)
    - pattern: tracing_subscriber::EnvFilter::new($FILTER)
    # The filter assembled from its ingredients instead of logging::env_filter.
    - pattern: EnvFilter::try_from_env($$$)
    - pattern: tracing_subscriber::EnvFilter::try_from_env($$$)
constraints:
  FILTER:
    kind: string_literal
