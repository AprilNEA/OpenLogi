# Owner: `impl From<&FirmwareRelease> for FirmwareVersion` in
# openlogi_core::hid::firmware converts a catalog release into the version it
# installs. Consumers call `FirmwareVersion::from(release)` / `release.into()`
# instead of rebuilding the version from the release's fields.
id: core-firmware-release-version-owner
language: rust
severity: error
message: Use FirmwareVersion::from(release); openlogi_core::hid::firmware owns the release-to-version conversion.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-core/src/hid/firmware.rs
rule:
  pattern: 'FirmwareVersion { number: $R.number, revision: $R.revision, build: $R.build }'
