# Owner: openlogi_core::device::BatteryInfo::attention — whether a battery
# reading needs the user's attention, and how urgently (a discharging battery
# at 20% or less is low, at 10% or less critical; a device without a
# percentage falls back to its low/critical level). The settings app's warning
# tone and caption, the agent's low-battery notice, and the menu bar all ask
# it, so a device the app shows as low is the device the overlay announces,
# and one it shows as critical is the one the menu-bar icon marks.
id: core-battery-attention-owner
language: rust
severity: error
message: Whether and how urgently a battery reading needs attention is openlogi_core::device::BatteryInfo::attention's (needs_attention for the yes/no); use rearms_warning/rearms_overlay_notice for recovery; call these owners instead of comparing a battery percentage or testing for the low or critical battery levels here.
note: |
  The rule lived in the settings app (ui/battery.rs) until the agent needed
  it for its low-battery notice. A second threshold would let the overlay
  announce a battery the app does not show as low, or stay quiet about one it
  does. The critical tier was the app's own `level == Critical` test until
  the menu bar needed it too. See "Single source of truth" in AGENTS.md.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-core/src/device.rs
  - crates/openlogi-core/src/battery.rs
  - "**/tests.rs"
  - "**/tests/**"
rule:
  any:
    - kind: macro_invocation
      all:
        - regex: '^matches!'
        - regex: 'BatteryLevel::Low\b'
        - regex: 'BatteryLevel::Critical\b'
    - kind: binary_expression
      regex: '\bpercentage\s*<=?\s*[0-9A-Z]'
    - kind: binary_expression
      regex: '[=!]=\s*BatteryLevel::(Low|Critical)\b|BatteryLevel::(Low|Critical)\s*[=!]='
    - kind: binary_expression
      regex: '\b(percentage|charge)\s*(<=|<|>=|>)\s*(25|30)\b'
