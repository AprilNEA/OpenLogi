# Owner: openlogi_core::device::BatteryInfo methods in core/battery.rs.
# Every battery cue shares the attention policy. Overlay notices may reset on
# charging; persistent OS alerts require a measured recovery. Both decisions
# stay in the same owner so consumers cannot recreate their thresholds.
id: core-battery-attention-owner
language: rust
severity: error
message: Use BatteryInfo::severity, needs_attention, rearms_warning or rearms_overlay_notice; core/battery.rs owns battery policy.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-core/src/battery.rs
  - "**/tests.rs"
  - "**/tests/**"
rule:
  any:
    - kind: macro_invocation
      all:
        - regex: '^matches!'
        - regex: 'BatteryLevel::Low\b'
        - regex: 'BatteryLevel::Critical\b'
    - kind: binary_expression
      regex: '\bpercentage\s*<=?\s*[0-9A-Z]'
    - kind: binary_expression
      regex: '\b(percentage|charge)\s*(<=|<|>=|>)\s*(10|20|25|30|[A-Z][A-Z0-9_]*)\b'
