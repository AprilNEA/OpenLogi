# Owner: openlogi_core::hid::FirmwareBatteryCharge classifies firmware charge
# eligibility. Consumers may render the minimum but must not recompute the rule.
id: core-firmware-battery-charge-owner
language: rust
severity: error
message: Use FirmwareBatteryCharge::from_reading; core owns firmware charge eligibility.
files:
  - crates/**/firmware.rs
  - crates/**/firmware/**/*.rs
ignores:
  - crates/openlogi-core/src/hid/firmware.rs
  - "**/tests.rs"
  - "**/tests/**"
rule:
  all:
    - kind: binary_expression
    - any:
        - has:
            kind: integer_literal
            regex: '^30(?:_?u8)?$'
            stopBy: end
        - has:
            pattern: FirmwareBatteryCharge::minimum_percent()
            stopBy: end
