# Owner: openlogi_core::app — how a per-app map is matched against the
# foreground identifier: the exact key, then the Windows `exe:<filename>`
# fallback, then the `app:<alias>` key of the `[apps]` alias that lists the
# identifier (app/aliases.rs). Every per-app map (button overrides, Actions
# Ring layouts) resolves through overlay_for / profile_key_for, so one selector
# means one thing everywhere. The module also owns the `app:<alias>` key
# format. An editor's exact-key lookup (`per_app_overrides`, and the ring's
# `ActionRingConfig::profile_layout`) is a different question and is not
# matched here.
id: core-app-overlay-owner
language: rust
severity: error
message: Matching a per-app key against the foreground identifier is openlogi_core::app's (overlay_for, profile_key_for, AppAliases); call it instead of building an `exe:` or `app:` key, parsing an `app:` key, or indexing the ring's per_app map by the raw identifier here.
note: |
  action_ring.per_app looked the identifier up verbatim while
  per_app_bindings fell back to `exe:<filename>` (#643), so a Windows Store
  app kept its button overrides across an update and lost its ring layout.
  An `app:<alias>` key resolved anywhere but openlogi_core::app would repeat
  that split for every alias profile. See "Single source of truth" in
  AGENTS.md.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-core/src/app.rs
  - crates/openlogi-core/src/app/**
  - "**/tests.rs"
  - "**/tests/**"
rule:
  any:
    # `format!("exe:{name}")`: a metavariable inside a string literal never
    # matches, so the literal's prefix is matched structurally.
    - all:
        - kind: macro_invocation
        - has:
            field: macro
            regex: '^format$'
        - has:
            kind: token_tree
            has:
              kind: string_literal
              regex: '^"(exe|app):'
    - pattern: $KEY.strip_prefix("app:")
    - pattern: $KEY.starts_with("app:")
    # The ring editor's exact-key read: which layout a profile key holds, not
    # which layout applies to the application in front.
    - all:
        - pattern: $MAP.per_app.get($$$)
        - not:
            inside:
              kind: function_item
              has:
                field: name
                regex: '^profile_layout$'
              stopBy: end
