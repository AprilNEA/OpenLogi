# A configuration written by a released OpenLogi (schema 11) for a G402, a
# direct device that reports neither a serial nor a unit id: released builds
# keyed it by the all-zero unit id. Copied from a real file, interface
# preferences removed.
schema_version = 11

[devices."direct:046d:c07e:unit:00000000"]
dpi_presets = [
    1512,
    840,
    1008,
]
dpi = 1008

[devices."direct:046d:c07e:unit:00000000".identity]
display_name = "Gaming Mouse G402"
codename = "Gaming Mouse G402"
kind = "mouse"

[devices."direct:046d:c07e:unit:00000000".identity.model_info]
