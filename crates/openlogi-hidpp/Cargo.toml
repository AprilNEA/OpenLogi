# Hard fork of the `hidpp` crate from https://github.com/lus/logy
# @ commit 135c5600807845c269b5d5bfa1f33032281fbd86 (upstream v0.3.0, 2025-12-26),
# 0BSD © Lukas Schulte Pelkum (see LICENSE). Upstream is provenance, not a merge
# target — see AGENTS.md. The library target stays `hidpp` so dependents import
# it unchanged.
#
# Versioned with the OpenLogi workspace (unified versioning) rather than
# upstream's 0.3.0 — the upstream version is provenance, recorded above.
#
[package]
name = "openlogi-hidpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "0BSD"
repository.workspace = true
description = "OpenLogi's hard fork of the `hidpp` crate (Logitech HID++ protocol)."
keywords = ["hid++", "logitech", "hid", "mouse", "keyboard"]
categories = ["hardware-support"]
readme = "README.md"

[lib]
name = "hidpp"

[dependencies]
thiserror = { workspace = true }
hidreport = "0.5.0"
futures = "0.3.31"
futures-timer = "3.0.4"
async-trait = "0.1.88"
num_enum = "0.7.3"
async-channel = "2.3.1"
serde = { version = "1.0", features = ["derive"], optional = true }
hex = "0.4.3"
derive_builder = "0.20.2"
bitflags = { version = "2", features = ["serde"] }
# OpenLogi-specific: request-level wire tracing at trace!. Off by default
# (level-gated); enable with OPENLOGI_LOG=hidpp=trace. Not in upstream hidpp.
tracing = { workspace = true }
# OpenLogi-specific: generates the mechanical CreatableFeature/Feature impls
# for feature structs shaped `{ endpoint: FeatureEndpoint }` or `{ endpoint,
# events: EventSource<Event> }`. Not in upstream hidpp; used only here.
openlogi-hidpp-derive = { version = "0.7.9", path = "../openlogi-hidpp-derive" }
derive_more = { version = "2.1.1", default-features = false, features = ["from", "into"] }

[lints]
workspace = true
