# Owner: openlogi_ipc::client — connect_as, or ProtocolSkew::check on a
# probe_version answer.
id: ipc-protocol-version-owner
language: rust
severity: error
message: Protocol versions are judged once, in openlogi_ipc::client (connect_as, or ProtocolSkew::check on a probe_version answer). Consume the verdict instead of comparing PROTOCOL_VERSION here.
note: |
  The direction of a skew decides who must restart, and four clients once
  decided it four ways. See "Single source of truth" in AGENTS.md.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-ipc/**
rule:
  any:
    - pattern: $A == PROTOCOL_VERSION
    - pattern: $A != PROTOCOL_VERSION
    - pattern: $A < PROTOCOL_VERSION
    - pattern: $A > PROTOCOL_VERSION
    - pattern: $A <= PROTOCOL_VERSION
    - pattern: $A >= PROTOCOL_VERSION
    - pattern: PROTOCOL_VERSION == $A
    - pattern: PROTOCOL_VERSION != $A
    - pattern: PROTOCOL_VERSION < $A
    - pattern: PROTOCOL_VERSION > $A
    - pattern: PROTOCOL_VERSION <= $A
    - pattern: PROTOCOL_VERSION >= $A
