[package]
name = "openlogi-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The tarpc contract and local-socket transport shared by the OpenLogi agent and GUI."

[features]
# In-memory agents for client tests; see the `testing` module.
test-support = ["dep:futures-lite"]

[dependencies]
openlogi-core = { path = "../openlogi-core", version = "0.8.8" }
serde = { workspace = true }
thiserror = { workspace = true }
tarpc = { workspace = true }
tokio = { workspace = true }
interprocess = { workspace = true }
succession = { version = "0.2", features = ["serde"] }
futures-lite = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
bincode = "1.3"
futures-lite = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
