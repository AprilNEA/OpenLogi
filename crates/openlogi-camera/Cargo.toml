[package]
name = "openlogi-camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Generic Logitech UVC webcam discovery for OpenLogi (AVFoundation on macOS, DirectShow on Windows, V4L2 on Linux)."
keywords = ["logitech", "uvc", "webcam", "camera", "v4l2"]
categories = ["hardware-support"]

[dependencies]
openlogi-device-registry = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
block2 = { workspace = true }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFUUID",
] }
objc2-io-kit = { workspace = true, features = [
    "std",
    "libc",
    "usb",
    "AppleUSBDefinitions",
    "IOUSBLib",
    "USB",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
] }

# `zune-jpeg` decodes MJPEG straight to BGRA — gpui's texture order, so the
# preview needs no swap — and already ships in the tree via `image`.
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
zune-jpeg = "0.5"
zune-core = "0.5"

[lints]
workspace = true
