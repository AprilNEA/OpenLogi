# Owner: openlogi_core::runtime — the current-thread runtime OpenLogi's
# dedicated worker threads run on (`current_thread`), and the named thread
# that owns one (`spawn_thread`).
id: core-runtime-owner
language: rust
severity: error
message: Worker runtimes come from openlogi_core::runtime (current_thread for a runtime you drive yourself, spawn_thread for a named thread that owns one); do not build one here.
note: |
  Eleven sites once built the same current-thread runtime by hand — the two
  GPUI client loops, five agent watchers, three hardware writers, and the
  takeover probe. The agent's main multi-thread runtime is a different
  decision and stays where it is. See "Single source of truth" in AGENTS.md.
files:
  - crates/**/*.rs
  - xtask/**/*.rs
ignores:
  - crates/openlogi-core/**
rule:
  pattern: tokio::runtime::Builder::new_current_thread()
