# Owner: openlogi_cli::agent — how the CLI connects to the agent and how long
# it gives a snapshot.
id: cli-agent-access-owner
language: rust
severity: error
message: CLI subcommands reach the agent through crate::agent (connect, snapshot); do not connect or fetch a snapshot directly here.
note: |
  Two subcommands once carried their own client kind and snapshot budget.
  See "Single source of truth" in AGENTS.md.
files:
  - crates/openlogi-cli/**/*.rs
ignores:
  - crates/openlogi-cli/src/agent.rs
rule:
  any:
    - pattern: $P::connect_as($$$)
    - pattern: $C.snapshot(context::current())
    - pattern: $C.snapshot(tarpc::context::current())
