# Owner: openlogi_ipc::client::Observer, through the Ledger it keeps private —
# which observe answers are newer than what a connection has seen. Only the IPC
# clients are in scope: the agent side compares generations for its own
# reasons.
id: ipc-generation-ledger-owner
language: rust
severity: error
message: Whether an observe answer is newer than what this connection has seen is openlogi_ipc::client::Observer's call (Observer::next yields only newer answers). Do not compare generations by hand here.
note: |
  The desktop and the overlay once kept two ledgers, and one of them accepted
  stale replies. See "Single source of truth" in AGENTS.md.
files:
  - crates/openlogi-desktop/**/*.rs
  - crates/openlogi-overlay/**/*.rs
  - crates/openlogi-cli/**/*.rs
rule:
  # Any comparison with a `.generation` field or `.generation()` accessor on
  # either side, whichever way round it is written.
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^(==|!=|<=|>=|<|>)$'
    - has:
        any:
          - kind: field_expression
            regex: '\.generation$'
          - kind: call_expression
            regex: '\.generation\(\)$'
