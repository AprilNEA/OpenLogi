id: hid-native-mapping-owner
language: rust
severity: error
message: Use openlogi_hid::native_mapping for scoped UserKeyMapping reads, writes, and encoding.
note: The host adapter owns the native setter; agent effects must pass through the recovery journal.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-hid/src/native_mapping.rs
  - crates/openlogi-hid/src/native_mapping/**
  - "**/tests.rs"
  - "**/tests/**"
rule:
  all:
    - kind: string_literal
    - regex: '"(/usr/bin/hidutil|hidutil|UserKeyMapping|HIDKeyboardModifierMappingSrc|HIDKeyboardModifierMappingDst)"'
    - not:
        inside:
          kind: mod_item
          stopBy: end
          has:
            field: name
            regex: '^tests$'
