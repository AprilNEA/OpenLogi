# Owner: openlogi_core::env — the environment variables more than one process
# reads, and the log filter every process falls back to when its variable is
# unset.
id: core-env-knob-owner
language: rust
severity: error
message: The environment knobs read in more than one place are openlogi_core::env's (PROFILE, LOG and its LOG_DEFAULT fallback, ASSETS, FORCE_DEPOT); use the constant instead of the literal here.
note: |
  Five binaries spelled the log filter variable and its default by hand. See
  "Single source of truth" in AGENTS.md.
files:
  - crates/**/*.rs
  - xtask/**/*.rs
ignores:
  - crates/openlogi-core/**
rule:
  any:
    - pattern: '"OPENLOGI_PROFILE"'
    - pattern: '"OPENLOGI_LOG"'
    - pattern: '"OPENLOGI_ASSETS"'
    - pattern: '"OPENLOGI_FORCE_DEPOT"'
    # A fallback filter spelled inline instead of env::LOG_DEFAULT.
    - pattern: EnvFilter::new($FILTER)
    - pattern: tracing_subscriber::EnvFilter::new($FILTER)
constraints:
  FILTER:
    kind: string_literal
