id: workspace-no-inner-allow
language: Rust
severity: error
message: >-
  Module-wide `#![allow(…)]` is banned. Clippy's `allow_attributes` only sees
  outer attributes, so this one goes quiet when it stops suppressing anything.
  Owner: the workspace lint table in the root Cargo.toml (policy in
  .agents/rules/rust.md, "`expect` by default, `allow` only when `expect` would
  break").
note: >-
  Scope the suppression to the item that needs it and write
  `#[expect(<lint>, reason = "…")]`. When `expect` cannot work (the two cases in
  rust.md), use an outer `#[allow(<lint>, reason = "…")]` with
  `#[expect(clippy::allow_attributes, reason = "see above")]`.
rule:
  kind: inner_attribute_item
  # `#![allow(…)]` and `#![cfg_attr(<pred>, …, allow(…))]`. `#![expect(…)]`
  # reports itself when stale, so it stays legal.
  regex: '^#!\[\s*(?:allow|cfg_attr\s*\([\s\S]*\ballow)\s*\('
